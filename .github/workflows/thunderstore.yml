name: Thunderstore

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download FakeGameDevelopers.PEAKGameLibs (CI refs)
        run: |
          set -euo pipefail
          mkdir -p .gamelibs
          # Public fork with stripped+publicized PEAK 2.5.a Managed refs.
          curl -fsSL "https://github.com/fake-game-developers/PEAKGameLibs/archive/refs/heads/main.tar.gz" -o peakgamelibs.tar.gz
          tar -xzf peakgamelibs.tar.gz
          cp -r PEAKGameLibs-main/package/lib/. .gamelibs/
          test -f .gamelibs/Assembly-CSharp.dll
          echo "ManagedDir=$PWD/.gamelibs"

      - name: Build Thunderstore package
        run: |
          set -euo pipefail
          MANAGED_DIR="$PWD/.gamelibs"
          dotnet build Peak.Shotgun.slnx -c Release -target:PackTS -v m \
            -p:ManagedDir="$MANAGED_DIR/" \
            -p:PeakGameRootDir=""

      - name: Flatten package for direct Thunderstore upload
        id: package
        run: |
          set -euo pipefail
          # GitHub Actions wraps artifacts in a zip. Upload the *contents* of the
          # Thunderstore package so the downloaded artifact IS a valid TS zip.
          mkdir -p ts-artifact
          unzip -o artifacts/thunderstore/*.zip -d ts-artifact
          test -f ts-artifact/manifest.json
          test -f ts-artifact/icon.png
          test -f ts-artifact/README.md
          echo "path=ts-artifact" >> "$GITHUB_OUTPUT"

      - name: Upload Thunderstore-ready artifact
        uses: actions/upload-artifact@v4
        with:
          # Downloaded filename will be FakeGameDevelopers-PeakShotgun.zip — upload that to Thunderstore.
          name: FakeGameDevelopers-PeakShotgun
          path: ts-artifact/*
          if-no-files-found: error

      - name: Decide whether to publish
        id: publish
        run: |
          set -euo pipefail
          csproj=src/PeakShotgun/Peak.Shotgun.csproj
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$csproj")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Publish when the csproj version is not yet the live Thunderstore release.
          # Comparing only to the previous git commit misses bumps made while CI was red.
          live=$(curl -fsSL -A "peak-shotgun" "https://thunderstore.io/api/experimental/package/FakeGameDevelopers/PeakShotgun/" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version_number"])' \
            || true)
          echo "Live Thunderstore version: ${live:-<none>}"

          if [ -n "$live" ] && [ "$version" = "$live" ]; then
            echo "Version $version is already the live Thunderstore release."
            publish=false
          else
            publish=true
          fi

          echo "Version $version; publish=$publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Reuse Thunderstore categories
        if: steps.publish.outputs.publish == 'true'
        run: python3 .github/scripts/reuse-thunderstore-categories.py

      - name: Publish to Thunderstore
        if: steps.publish.outputs.publish == 'true'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TCLI_AUTH_TOKEN:-}" ]; then
            echo "TCLI_AUTH_TOKEN secret is not set."
            exit 1
          fi
          MANAGED_DIR="$PWD/.gamelibs"
          dotnet build Peak.Shotgun.slnx -c Release -target:PackTS -v m \
            -p:ManagedDir="$MANAGED_DIR/" \
            -p:PeakGameRootDir="" \
            -p:PublishTS=true

      - name: Attach package to GitHub Release (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Thunderstore build ${{ github.run_number }}"
          files: artifacts/thunderstore/*.zip
          generate_release_notes: true
          draft: true
