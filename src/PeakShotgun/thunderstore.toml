[config]
schemaVersion = "0.1.0"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "FakeGameDevelopers"
name = "PeakShotgun"
description = "Bring a shotgun on your PEAK climb. Two Roots suitcases always pack one; rare luggage rolls can unlock in other biomes. Pellet blasts injure scouts, ragdoll zombies, and KO them on the second shot."
websiteUrl = "https://github.com/fake-game-developers/peak-shotgun"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.2403"
PEAKModding-PEAKLib_Core = "1.7.2"
PEAKModding-PEAKLib_Items = "1.6.2"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/Peak.Shotgun/release/PeakShotgun.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# Explicit targets: tcli directory copy strips the first character of media filenames on Windows.
[[build.copy]]
source = "../../media/img1.jpg"
target = "/media/1.jpg"

[[build.copy]]
source = "../../media/img2.jpg"
target = "/media/2.jpg"

[[build.copy]]
source = "../../media/img3.jpg"
target = "/media/3.jpg"

[publish]
communities = [ "peak", ]

# Fallback for a first publish. CI replaces this with the live package categories.
[publish.categories]
peak = [ "mods", "items", "all" ]
