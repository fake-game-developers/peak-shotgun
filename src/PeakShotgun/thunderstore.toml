[config]
schemaVersion = "0.1.0"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "FakeGameDevelopers"
name = "PeakShotgun"
description = "A shotgun built from PEAK's blowgun. Blasts flip zombies harder than a coconut and dose them with drowsy."
websiteUrl = "https://github.com/TheCodinPro/Peak_AKGun"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.2403"
PEAKModding-PEAKLib_Core = "1.6.0"
PEAKModding-PEAKLib_Items = "1.6.2"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/PeakShotgun/release/PeakShotgun.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

[publish]
communities = [ "peak", ]

# Fallback for a first publish. CI replaces this with the live package categories.
[publish.categories]
peak = [ "mods", "items", "all" ]
